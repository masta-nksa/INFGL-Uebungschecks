# ---------------------------------------------------------------------------
#  Übungschecks Informatik Grundlagen – wird laufend um weitere Einheiten
#  ergänzt (Stand: Zahlensysteme, Hardware/Software, Netzwerktechnik-Grundlagen)
#  Jekyll-Konfiguration für GitHub Pages
# ---------------------------------------------------------------------------

title: "Übungschecks Informatik Grundlagen"
untertitel: "Theorie und Übungschecks zu den Einheiten im Modul"
description: "Theorie zum Nachlesen und Übungschecks zu den Einheiten im Modul Informatik Grundlagen (FHNW WING, 1. Semester)."
lang: "de-CH"

# WICHTIG ------------------------------------------------------------------
# baseurl muss dem Repository-Namen entsprechen, wenn die Seite unter
#   https://<username>.github.io/<repo-name>/  läuft (= Normalfall).
# Heisst das Repo z. B. "INFGL-Uebungschecks", muss hier "/INFGL-Uebungschecks" stehen.
# Nur bei einem Repo namens "<username>.github.io" bleibt der Wert leer ("").
baseurl: "/INFGL-Uebungschecks"
url: ""
# ---------------------------------------------------------------------------

# Fusszeile
schule: "FHNW WING, Informatik Grundlagen"

# Kein Theme: Layouts und CSS liegen vollständig in diesem Repo. GitHub Pages
# würde sonst das Standard-Theme "primer" laden, dessen Stylesheet den Pfad
# assets/css/style.css belegt – darum heisst unseres unterricht.css.
theme:

markdown: kramdown
kramdown:
  input: GFM              # aktiviert u. a. Task-Listen  - [ ] / - [x]
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-sitemap

# Beschriftung des Material-Typs im Badge.
# Ohne Eintrag bleibt das Badge leer.
art_labels:
  uebungscheck: "Übungscheck"
  theorie: "Theorie"

# Alle Dateien in lektionen/ sind Übungschecks und teilen dasselbe Layout.
# Die Aufgaben selbst stehen in assets/checks/*.json (Format: siehe README.md).
defaults:
  - scope:
      path: "lektionen"
      type: "pages"
    values:
      layout: "material"
      typ: "material"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .gitignore
