<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kontakt</title>
    <meta name="author" content="Max Muster">
    <meta name="description" content="Persönliche Webseite von Max Muster">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="site-header">
      <div class="bar">
        <a class="logo" href="./index.html">Max Muster</a>
        <nav class="site-nav" aria-label="Hauptnavigation">
          <a href="./index.html">Startseite</a>
          <a href="./ich.html">Wer bin ich</a>
          <a href="./gallery.html">Fotos</a>
          <a href="./kontakt.html" aria-current="page">Kontakt</a>
        </nav>
      </div>
    </header>
    <main class="container narrow">
      <h1>Kontakt</h1>

      <section class="panel">
        <h2>BMI berechnen</h2>
        <form id="bmi" action="https://www.inolten.ch/web/bmi.php" method="post">
          <div class="field">
            <label for="gewicht">Gewicht in kg</label>
            <input type="text" id="gewicht" name="gewicht" inputmode="decimal">
          </div>
          <div class="field">
            <label for="groesse">Grösse in cm</label>
            <input type="text" id="groesse" name="groesse" inputmode="decimal">
          </div>
          <div class="actions">
            <input class="button" type="submit" value="Berechnen">
            <input class="button button-ghost" type="reset" value="Formular leeren">
          </div>
        </form>
      </section>

      <section class="panel">
        <h2>Kontaktformular</h2>
        <form action="mailto:max.muster@example.ch" method="post">
          <div class="field">
            <label for="vorname">Vorname</label>
            <input type="text" id="vorname" name="vorname" placeholder="Vorname" required>
          </div>
          <div class="field">
            <label for="ort">Studienort</label>
            <select id="ort" name="studienort">
              <option>Olten</option>
              <option>Brugg</option>
            </select>
          </div>
          <fieldset>
            <legend>Zahlmethode</legend>
            <label class="choice"><input type="radio" name="zahlmethode" value="Mastercard"> Mastercard</label>
            <label class="choice"><input type="radio" name="zahlmethode" value="Visa"> Visa</label>
          </fieldset>
          <div class="actions">
            <input class="button" type="submit" value="Senden">
          </div>
        </form>
      </section>
    </main>
    <footer class="site-footer">
      <p>&copy; 2026 Max Muster · Analysieren um zu agieren</p>
    </footer>
  </body>
</html>
