---
layout: default
---
{%- assign lektionen = site.pages | where: "layout", "lektion" | sort: "lektion" -%}

<div class="hero">
  <div class="wrap">
    <h1>{{ site.title }}</h1>
    <div class="prose hero-text">
      {{ content }}
    </div>
  </div>
</div>

<div class="wrap">

  <h2 class="section-title">Einheiten</h2>
  <ol class="lektion-list">
    {%- for l in lektionen %}
    <li>
      <a href="{{ l.url | relative_url }}">
        <span class="lektion-nr">{{ l.lektion }}</span>
        <span class="lektion-body">
          <strong>{{ l.titel }}</strong>
          <span class="lektion-kurz">{{ l.kurz }}</span>
        </span>
        <span class="lektion-pfeil" aria-hidden="true">&rarr;</span>
      </a>
    </li>
    {%- endfor %}
  </ol>

</div>
